  <body>
    <h1>MASH</h1>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <p class="description">What is your favorite music genre?</p>
    <form action="" method="post" id="mash">
      <div id="answers" class="hide">
        <p>Your home is in <span id="answer_1"></span> with a <span id="answer_3"></span> as you are a <span id="answer_2"></span> who owns a <span id="home"></span>.
      </div>
      <div class="bucket">
        <div class="choice-bucket">
          <h4 class="highlight">Rap,Hip-Hop,R&B?</h4>
          <label>Enter an answer <input name="answer_1[]"></label>
          <label>Enter an answer <input name="answer_1[]"></label>
          <label>Enter an answer <input name="answer_1[]"></label>
          <label>Enter an answer <input name="answer_1[]"></label>
        </div>
        <div class="choice-bucket">
          <h4 class="highlight">Rock,Country?</h4>
          <label>Enter an answer <input name="answer_2[]"></label>
          <label>Enter an answer <input name="answer_2[]"></label>
          <label>Enter an answer <input name="answer_2[]"></label>
          <label>Enter an answer <input name="answer_2[]"></label>
        </div>
        <div class="choice-bucket">
          <h4 class="highlight">Pop,Dance,EDM,etc?</h4>
          <label>Enter an answer <input name="answer_3[]"></label>
          <label>Enter an answer <input name="answer_3[]"></label>
          <label>Enter an answer <input name="answer_3[]"></label>
          <label>Enter an answer <input name="answer_3[]"></label>
          <label>Enter an answer <input name="answer_3[]"></label>
        </div>
      </div>
      <button type="submit" class="button-submit">Tell my fortune</button>
    </form>  
    <script src="script.js"></script>
  </body>
